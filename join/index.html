---
layout: default
title: Join
styles:
  - /join/join.css
---
<main class="join">
  <section id="form-screen">
    <header>
      <h1>PWindows Quiz Engine</h1>
      <p class="tagline">Enter the room code from your teacher.</p>
    </header>

    <div class="form">
      <label>
        Room code
        <input id="code" type="text" maxlength="4" autocomplete="off"
               autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      </label>
      <label>
        Your name
        <input id="name" type="text" maxlength="24" autocomplete="off" placeholder="Alex">
      </label>
      <button id="btn-join">Join</button>
    </div>
  </section>

  <section id="game-screen" hidden></section>

  <div id="toast" class="toast" hidden></div>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="{{ '/join/src/join.js' | relative_url }}"></script>
